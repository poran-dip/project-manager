<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Poran Dip Projects</title>
  <!-- A 3x3 contribution grid brightening from bottom-left to top-right:
       projects moving forward. Colours are the app.css theme tokens. -->
  <rect width="32" height="32" rx="7" fill="#030f0b"/>
  <g fill="#34d399">
    <rect x="3.5" y="3.5" width="7" height="7" rx="1.75" fill-opacity="0.55"/>
    <rect x="12.5" y="3.5" width="7" height="7" rx="1.75" fill-opacity="0.8"/>
    <rect x="21.5" y="3.5" width="7" height="7" rx="1.75"/>

    <rect x="3.5" y="12.5" width="7" height="7" rx="1.75" fill-opacity="0.32"/>
    <rect x="12.5" y="12.5" width="7" height="7" rx="1.75" fill-opacity="0.55"/>
    <rect x="21.5" y="12.5" width="7" height="7" rx="1.75" fill-opacity="0.8"/>

    <rect x="3.5" y="21.5" width="7" height="7" rx="1.75" fill="#0d2b21"/>
    <rect x="12.5" y="21.5" width="7" height="7" rx="1.75" fill-opacity="0.32"/>
    <rect x="21.5" y="21.5" width="7" height="7" rx="1.75" fill-opacity="0.55"/>
  </g>
</svg>
